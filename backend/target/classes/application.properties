spring.application.name=wamis-backend
server.port=${SERVER_PORT:8080}

# Database Configurations
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/wamis_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:pass@123}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# SQL Initialization
# spring.sql.init.mode=always
# spring.sql.init.data-locations=classpath:db/data.sql
# spring.jpa.defer-datasource-initialization=true

# JPA / Hibernate Configurations
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Hibernate Envers Configuration
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

# Multipart Upload Configurations
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
wamis.upload-dir=uploads

# Custom Application Properties
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:4200}
